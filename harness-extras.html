<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Nexo — crie seu servidor, organize categorias e canais, convide pessoas e converse. Comunidades com identidade própria." />
  <title>Nexo · comunidades em órbita</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230E1517'/%3E%3Cpath d='M18 45V19l28 26V19' stroke='%2335E0A8' stroke-width='6.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/landing.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/chatmedia.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/permui.css" />
  <link rel="stylesheet" href="css/people.css" />
  <link rel="stylesheet" href="css/extras.css?v=1791223421" />
</head>
<body>
  <!-- Landing page pública (deslogado) -->
  <section id="screen-landing" class="screen screen--landing" hidden></section>

  <!-- Tela inicial / autenticação -->
  <section id="screen-auth" class="screen screen--auth" hidden></section>

  <!-- Página de convite -->
  <section id="screen-invite" class="screen screen--invite" hidden></section>

  <!-- Configurações do usuário (camada sobre o app) -->
  <section id="screen-settings" class="screen screen--settings" hidden></section>

  <!-- Aplicação principal -->
  <div id="screen-app" class="app-shell" hidden>
    <nav id="rail" class="rail" aria-label="Servidores"></nav>
    <aside id="sidebar" class="sidebar" aria-label="Canais do servidor"></aside>
    <main id="main" class="main">
      <header id="channel-header" class="channel-header"></header>
      <div id="main-content" class="main-content"></div>
      <footer id="composer" class="composer" hidden></footer>
    </main>
    <aside id="members" class="members" aria-label="Membros"></aside>
    <div id="scrim" class="scrim" hidden></div>
  </div>

  <!-- Camadas de UI -->
  <div id="modal-root"></div>
  <div id="popout-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/modals.js"></script>
  <!-- módulos auto-contidos (registram ações com prefixo próprio) -->
  <script src="js/landing.js"></script>
  <script src="js/chatmedia.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/permui.js"></script>
  <script src="js/people.js"></script>
  <script src="js/extras.js?v=1791223048"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      function params() { return new URLSearchParams(location.search); }
      function injectBar() {
        if (document.querySelector("[data-ex-bar]")) return;
        document.body.insertAdjacentHTML("beforeend", NX.extras.bottomBarHTML());
      }
      function typeIn(val) {
        var i = document.querySelector("[data-ex-input]");
        if (!i) return;
        i.value = val;
        i.dispatchEvent(new Event("input", { bubbles: true }));
      }
      function dbg(p) {
        if (!p.get("dbg")) return;
        var box = document.createElement("pre");
        box.style.cssText = "position:fixed;left:0;top:0;right:0;z-index:9999;margin:0;" +
          "background:#04110c;color:#7dffce;font:11px/1.35 monospace;padding:6px 8px;" +
          "white-space:pre-wrap;max-height:60%;overflow:auto;border-bottom:2px solid #35e0a8";
        var out = "vw=" + window.innerWidth + " dpr=" + devicePixelRatio +
          " bodyCls=" + document.body.className +
          " pad=" + getComputedStyle(document.body).paddingBottom + "\n";
        var bars = document.querySelectorAll("[data-ex-bar]");
        out += "bars=" + bars.length + "\n";
        Array.prototype.forEach.call(bars, function (b, i) {
          var r = b.getBoundingClientRect();
          var cs = getComputedStyle(b);
          out += i + ": parent=#" + (b.parentNode.id || b.parentNode.className) +
            " rect=" + Math.round(r.left) + "," + Math.round(r.top) + "," +
            Math.round(r.width) + "x" + Math.round(r.height) +
            " pos=" + cs.position + " left=" + cs.left + " right=" + cs.right +
            " disp=" + cs.display + " z=" + cs.zIndex + " hidden=" + b.hidden + "\n";
          Array.prototype.forEach.call(b.querySelectorAll("[data-nav]"), function (it) {
            var ir = it.getBoundingClientRect();
            out += "    " + it.getAttribute("data-nav") + " " + Math.round(ir.left) +
              ".." + Math.round(ir.right) + " active=" + it.classList.contains("is-active") +
              " flex=" + getComputedStyle(it).flex + "\n";
          });
        });
        var shell = document.getElementById("screen-app");
        if (shell) {
          var sr = shell.getBoundingClientRect();
          out += "shell=" + Math.round(sr.left) + "," + Math.round(sr.top) + "," +
            Math.round(sr.width) + "x" + Math.round(sr.height) +
            " hidden=" + shell.hidden + " bottom=" + getComputedStyle(shell).bottom + "\n";
        }
        var rail = document.getElementById("rail");
        if (rail) {
          var rr = rail.getBoundingClientRect();
          out += "rail=" + Math.round(rr.left) + ".." + Math.round(rr.right) +
            " z=" + getComputedStyle(rail).zIndex + "\n";
        }
        var comp = document.getElementById("composer");
        if (comp) {
          var cr = comp.getBoundingClientRect();
          out += "composer=" + Math.round(cr.left) + "," + Math.round(cr.top) + "," +
            Math.round(cr.width) + "x" + Math.round(cr.height) +
            " hidden=" + comp.hidden + " pb=" + getComputedStyle(comp).paddingBottom + "\n";
        }
        var b0 = document.querySelector("[data-ex-bar]");
        if (b0 && shell) {
          var bt = b0.getBoundingClientRect();
          out += "barTop=" + Math.round(bt.top) + " shellBottom=" + Math.round(sr.bottom) +
            " diff(shellBottom-barTop)=" + Math.round(sr.bottom - bt.top) + "\n";
          if (comp) {
            var cb2 = comp.getBoundingClientRect();
            out += "composerBox=" + Math.round(cb2.top) + ".." + Math.round(cb2.bottom) +
              " diff(composerBottom-barTop)=" + Math.round(cb2.bottom - bt.top) + "\n";
          }
        }
        out += "hash=" + location.hash + " route=" +
          (NX.app && NX.app.route ? NX.app.route.name : "-") + "\n";
        out += "unread=" + (NX.selectors.me() ? NX.selectors.unreadNotifications(NX.selectors.me().id) : -1) + "\n";
        out += "clientW=" + document.documentElement.clientWidth +
          " outer=" + window.outerWidth + "\n";
        box.textContent = out;
        document.body.appendChild(box);
        var flat = out.split("\n").join(" ; ");
        for (var ci = 0; ci < flat.length; ci += 150) {
          console.error("error-dbg#" + ci + ": " + flat.slice(ci, ci + 150));
        }

        /* régua: revela escala/corte da captura */
        var ruler = document.createElement("div");
        ruler.style.cssText = "position:fixed;left:0;right:0;bottom:58px;height:30px;" +
          "z-index:99998;background:rgba(0,0,0,.8);font:9px monospace;color:#ffd479";
        var html = "";
        for (var x = 0; x <= 600; x += 50) {
          html += '<b style="position:absolute;left:' + x + 'px;top:0;border-left:3px solid #ff6b7a;' +
            'height:30px;padding-left:2px">' + x + "</b>";
        }
        ruler.innerHTML = html;
        document.body.appendChild(ruler);
      }

      function navigate(p) {
        var nav = p.get("nav");
        if (!nav) return;
        if (nav === "channel") {
          var me = NX.selectors.me();
          var servers = NX.selectors.serversOf(me.id);
          for (var i = 0; i < servers.length; i++) {
            var tree = NX.selectors.visibleCategoryTree(servers[i].id, me.id);
            if (tree.length && tree[0].channels.length) {
              NX.app.go("#/s/" + servers[i].id + "/" + tree[0].channels[0].id);
              return;
            }
          }
        } else {
          NX.app.go(nav);
        }
      }

      /* restaura o estado de não-lidas do seed (mesmo DB é compartilhado) */
      function fixNotif() {
        if (!NX.store.ready || !Object.keys(NX.store.db.users || {}).length) return;
        var me = NX.selectors.me();
        if (!me) return;
        var mine = (NX.store.db.notifications || []).filter(function (n) {
          return n.userId === me.id;
        });
        mine.sort(function (a, b) { return b.at - a.at; });
        mine.forEach(function (n, i) { n.read = i >= 2; });
        NX.store.commit(["notifications"]);
      }

      function runTests(p) {
        if (!p.get("test")) return;
        var log = function (tag, msg) { console.error("error-" + tag + ": " + msg); };
        var fire = function (key) {
          document.dispatchEvent(new KeyboardEvent("keydown", { key: key, bubbles: true, cancelable: true }));
        };
        setTimeout(function () {
          log("t1", "aberto=" + JSON.stringify(NX.extras.isOpen()));
          var rows = document.querySelectorAll(".ex-res");
          log("t2", "linhas=" + rows.length);
          fire("ArrowDown");
          var act = document.querySelector(".ex-res.is-active");
          log("t3", "ativo=" + (act ? act.textContent.replace(/\s+/g, " ").slice(0, 46) : "-"));
          fire("Enter");
          setTimeout(function () {
            log("t4", "hash=" + location.hash + " buscaAberta=" + NX.extras.isOpen().search);
            var bell = document.querySelector('[data-action="nx-bell"]');
            bell.click();
            setTimeout(function () {
              log("t5", "painel=" + !document.getElementById("ex-notif").hidden +
                " itens=" + document.querySelectorAll(".ex-notif__item").length);
              var readAll = document.querySelector('[data-action="nx-notif-read-all"]');
              readAll.click();
              setTimeout(function () {
                var me = NX.selectors.me();
                log("t6", "naoLidasAposMarcar=" + NX.selectors.unreadNotifications(me.id) +
                  " badge=" + (document.querySelector("[data-ex-badge]").hidden ? "oculto" : "visivel"));
                var bell2 = document.querySelector('[data-action="nx-bell"]');
                bell2.click();
                setTimeout(function () {
                  fire("Escape");
                  setTimeout(function () {
                    log("t7", "painelFechado=" + document.getElementById("ex-notif").hidden +
                      " searchAberta=" + NX.extras.isOpen().search);
                  }, 260);
                }, 120);
              }, 400);
            }, 200);
          }, 260);
        }, 900);
      }

      function boot() {
        try {
          NX.extras.mount();
          injectBar();
          NX.extras.refreshBadges();
          NX.extras.syncNav();
        } catch (e) { console.error("[harness]", e); }
        var p = params();
        if (p.get("unread")) setTimeout(fixNotif, 500);
        var mode = p.get("ex");
        var term = p.get("q");
        if (p.get("nav")) setTimeout(function () { navigate(p); }, 60);
        if (p.get("test")) setTimeout(function () { runTests(p); }, 200);
        setTimeout(function () {
          try {
            if (term) { NX.extras.openSearch(); typeIn(term); }
            else if (mode === "search") NX.extras.openSearch();
            else if (mode === "notif") NX.extras.openNotifications();
            dbg(p);
            document.documentElement.setAttribute("data-ex-ready", "1");
          } catch (e) { console.error("[harness:open]", e); }
        }, term ? 300 : p.get("nav") ? 500 : 150);
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
      else boot();
    })();
  </script>
</body>
</html>
