<script>
/* Bancada de testes do painel admin
   ?srv=0|1|2|<id>  ?tab=<id|cargo:novo>  ?noopen=1  ?probe=1 */
(function(){
  try{
    var p=new URLSearchParams(location.search);
    if(p.get("noopen")==="1") return;

    function probe(){
      if(p.get("probe")!=="1") return;
      function take(){
        try{
          var b=document.querySelector(".modal-backdrop");
          var cs=b?getComputedStyle(b):{opacity:"-"};
          var nav=document.querySelector(".adm-nav");
          var bd=document.querySelector(".adm-body");
          var nl=document.querySelector(".adm-nav__list");
          var nr=nav?nav.getBoundingClientRect():null;
          var br=bd?bd.getBoundingClientRect():null;
          document.title="PROBE op="+cs.opacity+
            " vw="+window.innerWidth+
            " nav="+(nr?Math.round(nr.x)+","+Math.round(nr.y)+" "+Math.round(nr.width)+"x"+Math.round(nr.height):"-")+
            " body="+(br?Math.round(br.x)+","+Math.round(br.y)+" "+Math.round(br.width):"-")+
            " navScroll="+(nl?Math.round(nl.scrollWidth)+"/"+Math.round(nl.clientWidth):"-");
        }catch(e){ document.title="PROBE ERR "+e.message; }
      }
      setTimeout(take, 2500);
      setTimeout(take, 5200);
    }

    function openIt(){
      try{
        var S=NX.selectors, me=S.me();
        if(!me){ console.warn("harness: sem sessao"); return; }
        var all=S.serversOf(me.id)||[];
        var key=p.get("srv"), srv=null;
        if(key!==null && key!==""){
          if(/^\d+$/.test(key)) srv=all[Number(key)]||null;
          else srv=S.server(key)||null;
        }
        if(!srv) srv=all[0];
        if(!srv){ console.warn("harness: sem servidor"); return; }
        var tab=p.get("tab");
        NX.admin.open(srv.id, tab||null);
        probe();
      }catch(e){ console.warn("harness open", e); }
    }

    function ensureSession(done){
      try{
        if(NX.selectors.me()) return done();
        NX.api.login({ identifier:"demo@nexo.chat", password:"nexo123", remember:false })
          .then(function(){ setTimeout(done, 250); })
          .catch(function(e){ console.warn("harness login", e); });
      }catch(e){ console.warn("harness session", e); done(); }
    }

    function routeToServer(done){
      try{
        var S=NX.selectors, me=S.me();
        var all=S.serversOf(me.id)||[];
        var key=p.get("srv"), srv=null;
        if(key!==null && key!==""){
          if(/^\d+$/.test(key)) srv=all[Number(key)]||null;
          else srv=S.server(key)||null;
        }
        if(!srv) srv=all[0];
        if(srv) location.hash = "#/s/" + srv.id;
      }catch(e){ console.warn("harness route", e); }
      setTimeout(done, 350);
    }

    function start(){
      ensureSession(function(){
        routeToServer(openIt);
      });
    }

    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start);
    else window.addEventListener("load", start);
  }catch(e){ console.warn("harness bootstrap", e); }
})();
</script>
