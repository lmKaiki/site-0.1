<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Nexo · bancada de rotas</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/landing.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/chatmedia.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/permui.css" />
  <link rel="stylesheet" href="css/people.css" />
  <link rel="stylesheet" href="css/extras.css" />
</head>
<body>
  <section id="screen-landing" class="screen screen--landing" hidden></section>
  <section id="screen-auth" class="screen screen--auth" hidden></section>
  <section id="screen-invite" class="screen screen--invite" hidden></section>
  <section id="screen-settings" class="screen screen--settings" hidden></section>

  <div id="screen-app" class="app-shell" hidden>
    <nav id="rail" class="rail" aria-label="Servidores"></nav>
    <aside id="sidebar" class="sidebar" aria-label="Canais do servidor"></aside>
    <main id="main" class="main">
      <header id="channel-header" class="channel-header"></header>
      <div id="main-content" class="main-content"></div>
      <footer id="composer" class="composer" hidden></footer>
    </main>
    <aside id="members" class="members" aria-label="Membros"></aside>
    <div id="scrim" class="scrim" hidden></div>
  </div>

  <div id="modal-root"></div>
  <div id="popout-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <div id="__probe__" data-probe></div>
  <div id="__hash__" style="position:fixed;right:6px;bottom:6px;z-index:99999;font:11px monospace;background:#000;color:#0f0;padding:2px 6px;border-radius:4px;">(init)</div>
  <script>
    window.addEventListener("hashchange", function () {
      var p = document.getElementById("__probe__");
      if (p) p.setAttribute("data-hash", location.hash);
    });
    function __updHash__() {
      var e = document.getElementById("__hash__");
      if (e) e.textContent = location.hash || "(vazio)";
    }
    window.addEventListener("hashchange", __updHash__);
    document.addEventListener("DOMContentLoaded", __updHash__);
    setInterval(__updHash__, 400);
  </script>

  <script src="js/core.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/landing.js"></script>
  <script src="js/chatmedia.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/permui.js"></script>
  <script src="js/people.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* Bancada de testes: ?page=... escolhe a rota/cena sem cliques. */
    (function () {
      function pick() {
        var q = new URLSearchParams(location.search);
        var page = q.get("page") || "home";
        var S = NX.selectors;
        var me = S.me();
        if (!me) return "#/";
        var servers = S.serversOf(me.id);
        var srv = servers[0];
        var firstChannel = null;
        if (srv) {
          var tree = S.visibleCategoryTree(srv.id, me.id) || [];
          for (var i = 0; i < tree.length && !firstChannel; i++) {
            var cs = (tree[i] && tree[i].channels) || [];
            for (var j = 0; j < cs.length; j++) {
              if (cs[j] && cs[j].type === "text") { firstChannel = cs[j]; break; }
            }
          }
        }
        switch (page) {
          case "server":
            return srv ? "#/s/" + srv.id : "#/";
          case "channel":
            return srv && firstChannel ? "#/s/" + srv.id + "/" + firstChannel.id : "#/";
          case "profile":
            return "#/perfil/" + me.id;
          case "settings":
            return "#/config";
          case "messages":
            return "#/mensagens";
          case "explore":
            return "#/explorar";
          case "welcome":
            return "#/bem-vindo";
          case "login":
            return "#/login";
          case "signup":
            return "#/cadastro";
          case "forgot":
            return "#/recuperar";
          case "admin":
            if (srv) setTimeout(function () { NX.admin.open(srv.id, q.get("tab") || "general"); }, 400);
            return "#/";
          case "perms":
            if (firstChannel) setTimeout(function () { NX.permUI.openChannel(firstChannel.id); }, 400);
            return "#/";
          case "emoji":
            return "emoji:" + (srv ? srv.id : "");
          default:
            return "#/";
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        try {
          var target = pick();
          if (target.indexOf("emoji:") === 0) return;
          location.hash = target;
          window.__ROUTE__ = target;
        } catch (e) {
          window.__ROUTE_ERR__ = e.message;
        }
      });
    })();
  </script>
</body>
</html>
